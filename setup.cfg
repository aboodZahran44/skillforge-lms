[importlinter]
root_packages =
    accounts
    orgs
    catalog
    learning
    orders
    tutor
    config

[importlinter:contract:1]
name = orgs must not import accounts models directly
type = forbidden
source_modules =
    orgs
forbidden_modules =
    accounts

[importlinter:contract:2]
name = learning must not import catalog or orgs models directly
type = forbidden
source_modules =
    learning
forbidden_modules =
    catalog
    orgs

[importlinter:contract:3]
name = orders must not import accounts, catalog, learning, or orgs models directly
type = forbidden
source_modules =
    orders
forbidden_modules =
    accounts
    catalog
    learning
    orgs
ignore_imports =
    orders.services -> orgs.services

[importlinter:contract:4]
name = orgs must not import orders models directly
type = forbidden
source_modules =
    orgs
forbidden_modules =
    orders

[importlinter:contract:5]
name = tutor must not import catalog, learning, orgs, or accounts models directly
type = forbidden
source_modules =
    tutor
forbidden_modules =
    catalog
    learning
    orgs
    accounts

[importlinter:contract:6]
name = orgs must not import learning or catalog models directly
type = forbidden
source_modules =
    orgs
forbidden_modules =
    learning
    catalog

[importlinter:contract:7]
name = catalog must not import tutor models directly
type = forbidden
source_modules =
    catalog
forbidden_modules =
    tutor
ignore_imports =
    catalog.tasks -> tutor.services