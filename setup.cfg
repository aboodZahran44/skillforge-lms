[importlinter]
root_packages =
    accounts
    orgs
    catalog
    learning
    config

[importlinter:contract:1]
name = orgs must not import accounts models directly
type = forbidden
source_modules =
    orgs
forbidden_modules =
    accounts

[importlinter:contract:2]
name = learning must not import catalog or orgs models directly
type = forbidden
source_modules =
    learning
forbidden_modules =
    catalog
    orgs